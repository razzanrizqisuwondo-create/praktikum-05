<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Box 3</title>
  <link rel="stylesheet" href="cssbox3.css" />
</head>
<body>
  <div class="page">
    <div class="browser">
      <div class="toolbar">
        <div class="nav-group">
          <span>←</span>
          <span>→</span>
        </div>
        <div class="address-bar">
          <span class="label">Mozilla</span>
          <span class="url">http://box2.com</span>
        </div>
      </div>

      <div class="layout">
        <div class="top-row">
          <div class="small yellow"></div>
          <div class="big orange"></div>
        </div>

        <div class="bottom-row">
          <div class="left green"></div>
          <div class="center gray"></div>
          <div class="right blue"></div>
        </div>
        <div class="footer-row"></div>
      </div>
    </div>
  </div>
</body>
</html>
