<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Box 2</title>
  <link rel="stylesheet" href="cssbox2.css" />
</head>
<body>
  <div class="page">
    <div class="browser">
      <div class="toolbar">
        <div class="nav-btns">
          <span>←</span>
          <span>→</span>
        </div>
        <div class="address-bar">
          <span class="site-name">Mozilla</span>
          <span class="site-url">http://box1.com</span>
        </div>
      </div>

      <div class="canvas">
        <div class="row full-row">
          <div class="block green"></div>
        </div>

        <div class="row split-row">
          <div class="block yellow"></div>
          <div class="block orange"></div>
        </div>

        <div class="row split-row">
          <div class="block sky"></div>
          <div class="block cyan"></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
