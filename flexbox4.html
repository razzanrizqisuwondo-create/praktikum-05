<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexbox 4 - Dua Variasi Layout</title>
  <link rel="stylesheet" href="flexbox4.css">
</head>
<body>
  <main class="examples">
    <section class="example">
      <h1>Layout Flexbox 4(a)</h1>
      <div class="layout layout-a">
        <nav>Nav</nav>
        <div class="page-content">
          <header>Header</header>
          <div class="content-row">
            <article>Article</article>
            <aside>Aside</aside>
          </div>
          <footer>Footer</footer>
        </div>
      </div>
    </section>

    <section class="example">
      <h1>Layout Flexbox 4(b)</h1>
      <div class="layout layout-b">
        <header>Header</header>
        <div class="content-row">
          <aside>Aside</aside>
          <article>
            <h2>Article</h2>
            <div class="image-row">
              <img src="images/images1.jpg" alt="Sepasang burung perkutut">
              <img src="images/images2.jpg" alt="Burung perkutut di atas batu">
              <img src="images/images3.jpg" alt="Burung perkutut di jalan berbatu">
            </div>
          </article>
        </div>
        <footer>Footer</footer>
      </div>
    </section>
  </main>
</body>
</html>
