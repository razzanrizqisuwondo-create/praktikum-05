<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Box 1 - Galeri Foto</title>
  <link rel="stylesheet" href="cssbox1.css">
</head>
<body>
  <main class="browser">
    <div class="browser-title">Mozilla</div>
    <div class="browser-toolbar">
      <span class="browser-controls" aria-hidden="true">←　→　⟳</span>
      <span class="address">http://box1.com</span>
    </div>
    <section class="photo-row" aria-label="Galeri foto burung">
      <figure><img src="images/images1.jpg" alt="Sepasang burung perkutut"></figure>
      <figure><img src="images/images2.jpg" alt="Burung perkutut di atas batu"></figure>
      <figure><img src="images/images3.jpg" alt="Burung perkutut di jalan berbatu"></figure>
      <figure><img src="images/images1.jpg" alt="Sepasang burung perkutut di alam"></figure>
    </section>
  </main>
</body>
</html>
